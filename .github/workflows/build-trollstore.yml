name: Build DYYY 34.5 arm64e
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Theos and SDK
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          rm -rf "$HOME/theos/sdks"
          mv "$RUNNER_TEMP/theos-sdks" "$HOME/theos/sdks"
      - name: Install ldid
        run: brew install ldid
      - name: Build arm64e dylib
        run: |
          make -f Makefile.trollstore clean || true
          make -f Makefile.trollstore trollstore ARCHS=arm64e FINALPACKAGE=1
          mkdir -p artifact
          cp build-trollstore/DYYY.dylib artifact/DYYY.dylib
          cp build-trollstore/DYYY.plist artifact/DYYY.plist
          file artifact/DYYY.dylib
          xcrun --find ld
          otool -l artifact/DYYY.dylib > artifact/load-commands.txt
          codesign -s - --force artifact/DYYY.dylib
          codesign -dv --verbose=4 artifact/DYYY.dylib 2>&1 | tee artifact/codesign.txt
          mkdir -p artifact/package
          cp artifact/DYYY.dylib artifact/DYYY.plist artifact/package/
          ditto -c -k --sequesterRsrc artifact/package artifact/DYYY-TrollStore.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DYYY-34.5.0-TrollStore-arm64e
          path: artifact/*
      - name: Build arm64 dylib
        run: |
          make -f Makefile.trollstore clean || true
          make -f Makefile.trollstore trollstore ARCHS=arm64 FINALPACKAGE=1
          mkdir -p artifact-arm64/package
          cp build-trollstore/DYYY.dylib build-trollstore/DYYY.plist artifact-arm64/
          file artifact-arm64/DYYY.dylib
          otool -l artifact-arm64/DYYY.dylib > artifact-arm64/load-commands.txt
          codesign -s - --force artifact-arm64/DYYY.dylib
          codesign -dv --verbose=4 artifact-arm64/DYYY.dylib 2>&1 | tee artifact-arm64/codesign.txt
          cp artifact-arm64/DYYY.dylib artifact-arm64/DYYY.plist artifact-arm64/package/
          ditto -c -k --sequesterRsrc artifact-arm64/package artifact-arm64/DYYY-TrollStore.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DYYY-34.5.0-TrollStore-arm64
          path: artifact-arm64/*
      - name: Build empty injection probe
        run: |
          make -f Makefile.probe clean || true
          make -f Makefile.probe probe ARCHS=arm64e FINALPACKAGE=1
          mkdir -p artifact/probe
          cp probe-build/DYYYProbe.dylib probe-build/DYYYProbe.plist artifact/probe/
          file artifact/probe/DYYYProbe.dylib
          otool -l artifact/probe/DYYYProbe.dylib > artifact/probe/load-commands.txt
          codesign -dv --verbose=4 artifact/probe/DYYYProbe.dylib 2>&1 | tee artifact/probe/codesign.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DYYY-34.5.0-empty-probe
          path: artifact/probe/*
      - name: Build empty arm64 probe
        run: |
          make -f Makefile.probe clean || true
          make -f Makefile.probe probe ARCHS=arm64 FINALPACKAGE=1
          mkdir -p artifact/probe-arm64
          cp probe-build/DYYYProbe.dylib probe-build/DYYYProbe.plist artifact/probe-arm64/
          file artifact/probe-arm64/DYYYProbe.dylib
          otool -l artifact/probe-arm64/DYYYProbe.dylib > artifact/probe-arm64/load-commands.txt
          codesign -dv --verbose=4 artifact/probe-arm64/DYYYProbe.dylib 2>&1 | tee artifact/probe-arm64/codesign.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DYYY-34.5.0-empty-probe-arm64
          path: artifact/probe-arm64/*
